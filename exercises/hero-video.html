<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Block with Video</title>
    <meta name="description"
        content="A hero block with a background video that plays in a continuous loop and includes a tinted overlay.">
    <link rel="preload" href="../assets/video/hero.video.mp4" as="image">
    <!-- Link to Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Custom styles -->
    <style type="text/tailwindcss">
        @keyframes bg-change {
            0%   { background-color: red }
            100% { background-color: yellow }
  
        }
        header::before{
            content: "";
            @apply absolute inset-0 
            bg-linear-to-b
            from-blue-950/70
            to-pink-900/30;
        }
        header { 
        @apply relative
            min-h-[60vh] md:min-h-[80vh]
            flex flex-col justify-center
            text-center
            overflow-hidden;

            background-color: red;
            animation-name: bg-change;
            animation-duration: 4s  
        }
        header video {
            @apply absolute inset-0 
            w-full h-full 
            object-cover object-center;
        }

        header h1,
        header h2 {
            @apply relative z-10
            text-7xl md:text-8xl
            text-white font-bold
            tracking-tight
            mb-6;
        }

        header h2 {
            @apply text-4xl md:text-5xl
            text-white;
        }

        .slide-in-top {
	        -webkit-animation: slide-in-top 0.5s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
	        animation: slide-in-top 0.5s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
        }

        .slide-in-left {
	        animation: slide-in-left 0.5s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
        }
        
        /* ----------------------------------------------
         * Generated by Animista on 2026-10-16 10:28:48
        * Licensed under FreeBSD License.
        * See http://animista.net/license for more info. 
        * w: http://animista.net, t: @cssanimista
         * ---------------------------------------------- */

        /**
        * ----------------------------------------
        * animation slide-in-top
        * ----------------------------------------
        */
        @-webkit-keyframes slide-in-top {
        0% {
                    transform: translateY(-1000px);
            opacity: 0;
        }
        100% {
                    transform: translateY(0);
            opacity: 1;
        }
        }
        @keyframes slide-in-left {
        0% {
                    transform: translateX(-1000px);
            opacity: 0;
        }
        100% {
                    transform: translateX(0);
            opacity: 1;
        }
        }



    </style>

</head>


<body>

    <header>
        <video autoplay muted loop playsinline poster="../assets/video/hero-still.jpg">

            <source src="../assets/video/hero.video.mp4" type="video/mp4">
        </video>
        <h1>Education for life</h1>

        <h2>A brighter career and future</h2>
    </header>


</body>

</html>
